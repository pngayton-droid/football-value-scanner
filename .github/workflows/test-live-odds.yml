
name: Test live bookmaker odds

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Test live odds API
        env:
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
        run: python test_live_odds.py
